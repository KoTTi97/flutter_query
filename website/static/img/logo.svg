<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="query_kit">
  <!-- Three cached entries, the newest in front: what the library actually is.
       Explicit fills, because an <img>-referenced SVG inherits no colour, and
       three flat blues rather than one blue at three opacities, so the mark
       holds up at 26px on either background. -->
  <rect x="4" y="4.5" width="20" height="8" rx="2.5" fill="#a8cdf4"/>
  <rect x="6" y="11.5" width="20" height="8" rx="2.5" fill="#4b9bea"/>
  <rect x="8" y="18.5" width="20" height="8" rx="2.5" fill="#0b6bcb"/>
</svg>
