name: sensor_demo
description: >-
  The react-demo sensor manager, rebuilt on tanstack_query_flutter. Same
  gateway, same cache policy, same scripted failures — so the two clients can be
  compared side by side.
version: 0.1.0-dev
publish_to: none

environment:
  sdk: ^3.6.0
  flutter: ">=3.13.0"

resolution: workspace

dependencies:
  dio: ^5.7.0
  flutter:
    sdk: flutter
  tanstack_query_flutter: ^0.1.0-dev

dev_dependencies:
  flutter_test:
    sdk: flutter
  lints: ^6.0.0
