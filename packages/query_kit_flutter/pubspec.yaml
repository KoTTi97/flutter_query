name: query_kit_flutter
description: >-
  Flutter binding for query_kit: a provider, controllers, builder widgets, a
  State mixin and context.query. An AI-coded community port, not affiliated
  with TanStack.
version: 1.0.0
repository: https://github.com/dualmeta-gmbh/query_kit
issue_tracker: https://github.com/dualmeta-gmbh/query_kit/issues
topics:
  - cache
  - state-management
  - data-fetching
  - tanstack-query
  - async

environment:
  sdk: ^3.6.0
  flutter: ">=3.27.0"

resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  meta: ^1.15.0
  query_kit: ^1.0.0

dev_dependencies:
  clock: ^1.1.1
  flutter_test:
    sdk: flutter
  lints: '>=5.1.1 <7.0.0'
