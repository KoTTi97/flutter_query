# Self-contained on purpose: this file ships with the package, and a copy
# analysed outside the monorepo must not reach for a file it does not have.
# Keep in step with the repository's root analysis_options.yaml.
include: package:lints/recommended.yaml

analyzer:
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true

linter:
  rules:
    - always_declare_return_types
    - avoid_dynamic_calls
    - cancel_subscriptions
    - directives_ordering
    - prefer_final_locals
    - prefer_relative_imports
    - public_member_api_docs
    - unawaited_futures
    - unnecessary_lambdas
    - use_super_parameters
