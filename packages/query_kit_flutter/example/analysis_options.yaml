# The example is a one-file tour, not API: the package's rules without
# public_member_api_docs. Self-contained, like the package's own file, because
# example/ ships with the package.
include: package:lints/recommended.yaml

analyzer:
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true

linter:
  rules:
    - always_declare_return_types
    - avoid_dynamic_calls
    - cancel_subscriptions
    - directives_ordering
    - prefer_final_locals
    - prefer_relative_imports
    - unawaited_futures
    - unnecessary_lambdas
    - use_super_parameters
