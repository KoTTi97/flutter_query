name: tanstack_query_core
description: >-
  A Dart port of TanStack Query's query-core: caching, background refetching,
  staleness and mutations, with no Flutter dependency. An independent community
  port, not affiliated with or endorsed by TanStack.
version: 0.1.0-dev
repository: https://github.com/KoTTi97/flutter_query
publish_to: none

environment:
  sdk: ^3.6.0

resolution: workspace

dependencies:
  clock: ^1.1.2
  meta: ^1.16.0

dev_dependencies:
  fake_async: ^1.3.2
  lints: ^6.0.0
  test: ^1.25.0
