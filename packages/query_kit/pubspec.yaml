name: query_kit
description: >-
  Dart port of TanStack Query's query-core: caching, refetching, staleness
  and mutations, no Flutter needed. Independent community port, not affiliated
  with or endorsed by TanStack.
version: 0.1.0-dev
repository: https://github.com/KoTTi97/flutter_query
issue_tracker: https://github.com/KoTTi97/flutter_query/issues
topics:
  - cache
  - state-management
  - query
  - tanstack-query
  - async

environment:
  sdk: ^3.6.0

resolution: workspace

dependencies:
  clock: ^1.1.1
  meta: ^1.15.0

dev_dependencies:
  fake_async: ^1.3.1
  lints: '>=5.1.1 <7.0.0'
  test: ^1.25.0
