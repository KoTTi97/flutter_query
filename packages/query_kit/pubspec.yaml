name: query_kit
description: >-
  Dart port of TanStack Query's query-core: caching, background refetching,
  retries and mutations, no Flutter needed. An AI-coded community port, not
  affiliated with TanStack.
version: 1.0.0
repository: https://github.com/KoTTi97/query_kit
issue_tracker: https://github.com/KoTTi97/query_kit/issues
topics:
  - cache
  - state-management
  - data-fetching
  - tanstack-query
  - async

environment:
  sdk: ^3.6.0

resolution: workspace

dependencies:
  clock: ^1.1.1
  meta: ^1.15.0

dev_dependencies:
  fake_async: ^1.3.1
  lints: '>=5.1.1 <7.0.0'
  test: ^1.25.0
