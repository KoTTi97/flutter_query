# Publishes one package to pub.dev when its tag is pushed — see
# docs/releasing.md for the order (core first) and the pub.dev-side switch this
# needs. Uses pub.dev's automated publishing over GitHub OIDC: no secrets.
#
# Not `dart-lang/setup-dart`'s reusable publish workflow: it installs the Dart
# SDK only, and both packages resolve inside the root workspace, whose members
# include the binding and the Flutter examples — a Dart-only `pub get` there
# fails, and the binding cannot be validated without Flutter at all. So this
# is the custom workflow pub.dev documents
# (https://dart.dev/tools/pub/automated-publishing): `setup-dart` exchanges the
# GitHub OIDC token for a pub.dev one and registers it with pub (`PUB_TOKEN`,
# in pub's own credential store, which the Flutter SDK's pub reads too), then
# Flutter is installed and publishes.
name: publish

on:
  push:
    tags:
      - 'query_kit-v[0-9]+.[0-9]+.[0-9]+*'
      - 'query_kit_flutter-v[0-9]+.[0-9]+.[0-9]+*'

jobs:
  publish:
    permissions:
      id-token: write
    runs-on: ubuntu-latest
    steps:
      - name: Package directory from the tag
        id: package
        run: |
          case "$GITHUB_REF_NAME" in
            query_kit_flutter-v*) echo "dir=packages/query_kit_flutter" >> "$GITHUB_OUTPUT" ;;
            query_kit-v*) echo "dir=packages/query_kit" >> "$GITHUB_OUTPUT" ;;
            *) echo "unexpected tag $GITHUB_REF_NAME" >&2; exit 1 ;;
          esac
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The tag names what is published: a tag whose version is not the
      # pubspec's would publish the checkout's version under the wrong name.
      - name: Tag matches the pubspec
        working-directory: ${{ steps.package.outputs.dir }}
        run: |
          tag_version="${GITHUB_REF_NAME#*-v}"
          tag_package="${GITHUB_REF_NAME%-v*}"
          # The top-level scalar, without an inline comment or YAML quotes.
          field() {
            sed -n "s/^$1:[[:space:]]*//p" pubspec.yaml \
              | sed -e 's/[[:space:]]#.*$//' -e 's/[[:space:]]*$//' \
                    -e "s/^'\\(.*\\)'\$/\\1/" -e 's/^"\(.*\)"$/\1/'
          }
          name=$(field name)
          version=$(field version)
          if [ "$name" != "$tag_package" ] || [ "$version" != "$tag_version" ]; then
            echo "tag $GITHUB_REF_NAME does not match pubspec $name $version" >&2
            exit 1
          fi
          echo "publishing $name $version"
      # Order matters: setup-dart registers the pub.dev token; flutter-action
      # then puts Flutter's own `dart` and `flutter` first on the PATH.
      - uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1.8.1
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: 3.38.8
      - name: Install dependencies
        run: flutter pub get
      - name: Publish
        run: flutter pub publish --force
        working-directory: ${{ steps.package.outputs.dir }}
