# Publishes one package to pub.dev when its tag is pushed — see
# docs/releasing.md for the order (core first) and the pub.dev-side switch this
# needs. Uses pub.dev's automated publishing over GitHub OIDC: no secrets.
name: publish

on:
  push:
    tags:
      - 'query_kit-v[0-9]+.[0-9]+.[0-9]+*'
      - 'query_kit_flutter-v[0-9]+.[0-9]+.[0-9]+*'

jobs:
  core:
    if: startsWith(github.ref_name, 'query_kit-v')
    permissions:
      id-token: write
    uses: dart-lang/setup-dart/.github/workflows/publish.yml@v1
    with:
      working-directory: packages/query_kit

  flutter:
    if: startsWith(github.ref_name, 'query_kit_flutter-v')
    permissions:
      id-token: write
    uses: dart-lang/setup-dart/.github/workflows/publish.yml@v1
    with:
      working-directory: packages/query_kit_flutter
