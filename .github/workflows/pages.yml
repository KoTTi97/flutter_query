# Deploys the documentation site, live demos included, to GitHub Pages at
# https://dualmeta-gmbh.github.io/query_kit/ — on a core release tag, or by hand
# from the Actions tab.
#
# Needs two repository settings, both on since 2026-09-23: the Pages source
# "GitHub Actions", and a `github-pages` environment that allows the tag
# pattern `query_kit-v*` besides `main` — without it a tag's deploy is rejected
# by environment protection (docs/releasing.md, "Documentation site"). The build is the `ci`
# workflow's `website` job, step for step, so what CI tested is what ships.
name: pages

on:
  push:
    tags:
      - 'query_kit-v[0-9]+.[0-9]+.[0-9]+*'
  workflow_dispatch:

# Nothing by default; each job asks for what it needs — the build only reads
# the repository, and only the deploy may write to Pages.
permissions: {}

# One deployment at a time; a newer one waits rather than cancelling a
# deployment halfway.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: 3.38.8
          cache: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: website/package-lock.json
      - run: flutter pub get
      - name: live demos
        run: tool/build_demos.sh
      - run: npm ci
        working-directory: website
      - name: build
        run: npm run build
        working-directory: website
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4.0.0
        with:
          path: website/build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
