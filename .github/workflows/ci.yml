# The per-module gate from CLAUDE.md, on a fresh checkout: tests, analyzer,
# formatter, and one real app build of the demo.
name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.38.8
          cache: true
      - run: flutter pub get
      - name: core tests
        run: dart test
        working-directory: packages/tanstack_query_core
      - name: binding tests
        run: flutter test
        working-directory: packages/tanstack_query_flutter
      - name: demo tests
        run: flutter test
        working-directory: examples/sensor_demo
      # `dart pub publish --dry-run` exits 65 when validation finds a warning
      # (a missing CHANGELOG, say) and 0 when the package is clean, so a
      # warning fails the job without any extra flag.
      - name: core publish dry-run
        run: dart pub publish --dry-run
        working-directory: packages/tanstack_query_core
      - name: binding publish dry-run
        run: dart pub publish --dry-run
        working-directory: packages/tanstack_query_flutter
      - name: analyzer
        run: dart analyze --fatal-infos packages examples/sensor_demo
      - name: formatter
        run: dart format --set-exit-if-changed --output=none packages examples/sensor_demo/lib examples/sensor_demo/test
      - name: demo web build
        run: flutter build web --no-pub
        working-directory: examples/sensor_demo

  # The end-to-end suite: the real web build in a real Chromium against the
  # real express gateway, driven by Playwright (examples/sensor_demo/e2e).
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.38.8
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: flutter pub get
      - name: web build with semantics on
        run: flutter build web --no-pub --dart-define=E2E=true
        working-directory: examples/sensor_demo
      - name: gateway dependencies
        run: npm ci
        working-directory: react-demo/server
      - name: playwright
        run: npm ci && npx playwright install --with-deps chromium
        working-directory: examples/sensor_demo/e2e
      - name: end-to-end tests
        run: npx playwright test
        working-directory: examples/sensor_demo/e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            examples/sensor_demo/e2e/playwright-report
            examples/sensor_demo/e2e/test-results
          retention-days: 7
