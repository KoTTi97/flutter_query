include: package:lints/recommended.yaml

analyzer:
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true
  errors:
    # The port mirrors upstream structure closely; these keep that honest.
    unused_element: error
    unused_import: error

linter:
  rules:
    - always_declare_return_types
    - avoid_dynamic_calls
    - prefer_final_locals
    - unawaited_futures # D13: internally-held futures must be explicit
